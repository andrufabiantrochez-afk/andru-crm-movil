        .badge-red { background: rgba(239,68,68,0.2); color: #f87171; border: 1px solid rgba(239,68,68,0.4); }
        .badge-orange { background: rgba(249,115,22,0.2); color: #fb923c; border: 1px solid rgba(249,115,22,0.4); }
        .badge-yellow { background: rgba(245,158,11,0.2); color: #fbbf24; border: 1px solid rgba(245,158,11,0.4); }
        .badge-green { background: rgba(16,185,129,0.2); color: #34d399; border: 1px solid rgba(16,185,129,0.4); }

        .card-actions { display: flex; gap: 6px; margin-top: 6px; }

        .btn-wpp { background: #059669; color: white; }
        .btn-call { background: #0284c7; color: white; }
        .btn-cal { background: #7c3aed; color: white; }
        
        .fab-btn { position: fixed; bottom: 20px; right: 20px; background: #6366f1; color: white; width: 54px; height: 54px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; box-shadow: 0 10px 15px -3px rgba(99,102,241,0.5); border: none; cursor: pointer; z-index: 99; }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.12); }
            100% { transform: scale(1); }
        }

        .difusion-panel { background: #1e293b; border-radius: 12px; padding: 15px; border: 1px solid #3b82f6; display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; }
        .difusion-title { font-size: 14px; font-weight: bold; color: #60a5fa; display: flex; align-items: center; gap: 6px; }

        .modal-content { background: #1e293b; width:100%; max-width:400px; border-radius:14px; padding:20px; border:1px solid #475569; display:flex; flex-direction:column; gap:12px; }

        <button id="btn-ordenar-dia" class="btn-orden" onclick="alternarOrdenVencimiento()">
            📅 Ordenar por Día Vencimiento (1 al 31)

    </div>

    <div class="nav-tabs">

        <button class="tab-btn" id="tab-btn-prospectos" onclick="cambiarVista('prospectos')">👤 Prospectos</button>
        <button class="tab-btn" id="tab-btn-ganados" onclick="cambiarVista('ganados')">✅ Ventas Logradas</button>
        <button class="tab-btn" id="tab-btn-difusion" style="color:#60a5fa;" onclick="cambiarVista('difusion')">📢 Difusión Comercial</button>

    <div class="sub-nav" id="subnav-cobros">

        <button class="sub-btn" id="btn-sub-postergados" onclick="cambiarSubFiltroCobros('POSTERGADOS')">⏳ Postergados</button>
        <button class="sub-btn" id="btn-sub-todos" onclick="cambiarSubFiltroCobros('TODOS_PENDIENTES')">📋 Todos con Día</button>

            <div style="font-size:10px; color:#94a3b8;">

        </div>

        <div id="lista-tarjetas">
            <div class="loading">⏳ Conectando con Firebase...</div>

            <div class="form-group">

            <div class="form-group">

            <div class="form-group">

            </div>
            <div class="form-group">

        function cambiarVista(vista) {
            vistaActual = vista;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            let btnActivo = document.getElementById(`tab-btn-${vista}`);
            if(btnActivo) btnActivo.classList.add('active');

            let dia = parseInt(item.dia_pago, 10);
            if (!isNaN(dia)) return dia;

            let fechaStr = String(item.fecha_venta || item.fec_vinc || item.fecha_compra || "");
            let match = fechaStr.match(/\b([0-2]?[0-9]|3[01])\b/);
            if (match) return parseInt(match[1], 10);

            return 99;
        }

            let txt = document.getElementById('texto-difusion-custom').value.trim();

            mensajeDifusionCustom = txt;
            filtrarLista();

            </div>
            <div class="form-group">
                <label>Nombre Completo *</label>

                <label>Celular / WhatsApp *</label>

            </div>
            <div class="form-group">
                <label>Ciudad</label>

                <label>Empresa / Convenio</label>

    </div>

    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyBP4F7vQAMmXTWTRMSUSn7m4jdsiFRhnHU",
          authDomain: "andru-cmr-previser.firebaseapp.com",
          projectId: "andru-cmr-previser",
          storageBucket: "andru-cmr-previser.firebasestorage.app",
          messagingSenderId: "29995729300",
          appId: "1:29995729300:web:627108678d6c57eebe8f81"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        let vistaActual = 'cobros';
        let subFiltroCobros = 'DIA_ACTUAL';
        let registrosGlobales = [];
        let ordenVencimientoAsc = true;
        let mensajeDifusionCustom = "";

        function cambiarVista(vista) {
            vistaActual = vista;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            let btnActivo = document.getElementById(`tab-btn-${vista}`);
            if(btnActivo) btnActivo.classList.add('active');
            
            document.getElementById('subnav-cobros').style.display = (vista === 'cobros') ? 'flex' : 'none';
            document.getElementById('panel-difusion-comercial').style.display = (vista === 'difusion') ? 'flex' : 'none';

            if (vista === 'renovaciones') {
                document.getElementById('select-criterio').value = 'mes_compra';
            } else {
                document.getElementById('select-criterio').value = 'todo';
            }

            cargarDatosMovil();
        }

        function cambiarSubFiltroCobros(subFiltro) {
            subFiltroCobros = subFiltro;
            document.querySelectorAll('.sub-btn').forEach(btn => btn.classList.remove('active'));
            if (subFiltro === 'DIA_ACTUAL') document.getElementById('btn-sub-dia').classList.add('active');
            if (subFiltro === 'POSTERGADOS') document.getElementById('btn-sub-postergados').classList.add('active');
            if (subFiltro === 'TODOS_PENDIENTES') document.getElementById('btn-sub-todos').classList.add('active');
            cargarDatosMovil();
        }

        function alternarOrdenVencimiento() {
            ordenVencimientoAsc = !ordenVencimientoAsc;
            let btn = document.getElementById('btn-ordenar-dia');
            btn.innerText = ordenVencimientoAsc ? '📅 Ordenar por Día Vencimiento (1 al 31)' : '📅 Ordenar por Día Vencimiento (31 al 1)';
            filtrarLista();
        }

        function extraerDiaNum(item) {
            let dia = parseInt(item.dia_pago, 10);
            if (!isNaN(dia)) return dia;

            let fechaStr = String(item.fecha_venta || item.fec_vinc || item.fecha_compra || "");
            let match = fechaStr.match(/\b([0-2]?[0-9]|3[01])\b/);
            if (match) return parseInt(match[1], 10);

            return 99;
        }

        function aplicarMensajeDifusion() {
            let txt = document.getElementById('texto-difusion-custom').value.trim();
            if (!txt) {
                alert("Por favor escribe un mensaje para la difusión.");
                return;
            }
            mensajeDifusionCustom = txt;
            filtrarLista();
        }

        async function cargarDatosMovil() {
            const contenedor = document.getElementById('lista-tarjetas');
            contenedor.innerHTML = `<div class="loading">⏳ Consultando datos de Firebase...</div>`;

            let coleccion = 'afiliados';
            if (vistaActual === 'renovaciones' || vistaActual === 'ganados') coleccion = 'renovaciones';
            else if (vistaActual === 'prospectos') coleccion = 'prospectos';
            else if (vistaActual === 'difusion') coleccion = 'afiliados'; // Por defecto carga afiliados para campaña

            try {
                let mapaCedulasAfiliados = {};
                if (vistaActual === 'renovaciones' || vistaActual === 'ganados') {
                    const snapAfiliados = await db.collection("afiliados").get();
                    snapAfiliados.forEach(docA => {
                        let dataA = docA.data();
                        let ced = String(dataA.cedula || dataA.cedula_cliente || "").trim().replace(/^0+/, '');
                        if (ced) mapaCedulasAfiliados[ced] = true;
                    });
                }

                const snapshot = await db.collection(coleccion).get();
                registrosGlobales = [];

                let fechaHoy = new Date();
                let diaActualNum = fechaHoy.getDate();

                snapshot.forEach(doc => {
                    let d = doc.data();
                    d.idDoc = doc.id;
                    d.coleccionOrigen = coleccion;

                    let est = (d.estado || "").toLowerCase();
                    let cedulaLimpia = String(d.cedula || d.cedula_cliente || d.cedula_prospecto || "").trim().replace(/^0+/, '');
                    
                    let yaRenovo = (mapaCedulasAfiliados[cedulaLimpia] === true) || d.archivado === true || est.includes("afiliado") || est.includes("exitosa") || est.includes("renovado");
                    
                    d.yaRenovoComprado = yaRenovo;

                    if (vistaActual === 'cobros') {
                        let rawDia = String(d.dia_pago || "").trim();
                        let diaCobroNum = parseInt(rawDia, 10);
                        let esNumeroValido = !isNaN(diaCobroNum) && diaCobroNum >= 1 && diaCobroNum <= 31;
                        let estadoCobro = (d.estado_cobro || "").toLowerCase();

                        if (esNumeroValido) {
                            let esDelDia = diaCobroNum === diaActualNum;
                            let esPostergado = estadoCobro.includes("postergado") || estadoCobro.includes("pendiente") || diaCobroNum < diaActualNum;

                            let incluir = false;
                            if (subFiltroCobros === 'DIA_ACTUAL' && esDelDia && !estadoCobro.includes("pagado")) incluir = true;
                            else if (subFiltroCobros === 'POSTERGADOS' && esPostergado && !esDelDia && !estadoCobro.includes("pagado")) incluir = true;
                            else if (subFiltroCobros === 'TODOS_PENDIENTES' && !estadoCobro.includes("pagado")) incluir = true;

                            if (incluir) registrosGlobales.push(d);
                        }

                    } else if (vistaActual === 'afiliados' || vistaActual === 'difusion') {
                        registrosGlobales.push(d);

                    } else {
                        if (vistaActual === 'ganados' && yaRenovo) registrosGlobales.push(d);
                        else if (vistaActual === 'renovaciones') registrosGlobales.push(d);
                        else if (vistaActual === 'prospectos') registrosGlobales.push(d);
                    }
                });

                filtrarLista();

            } catch (err) {
                contenedor.innerHTML = `<div class="loading" style="color:#f87171;">❌ Error al cargar: ${err.message}</div>`;
            }
        }

        function renderizarTarjetas(lista) {
            const contenedor = document.getElementById('lista-tarjetas');
            const contador = document.getElementById('total-registros');
            contenedor.innerHTML = '';
            contador.innerText = `${lista.length} registros`;

            if (lista.length === 0) {
                contenedor.innerHTML = `<div class="loading" style="color:#94a3b8;">🎉 No hay registros para este filtro.</div>`;
                return;
            }

            let fechaHoy = new Date();
            let diaActualNum = fechaHoy.getDate();

            lista.forEach(item => {
                let nombre = String(item.titular || item.nombre || item.nombreCompleto || item.cliente || "Sin Nombre").toUpperCase();
                let cedula = item.cedula || item.cedula_cliente || item.cedula_prospecto || item.idDoc || "---";
                let celular = String(item.celular || item.telefono || item.movil || "");
                let empresa = item.empresa || item.convenio || item.empresa_interes || "No esta vinculado a una empresa";
                let ciudad = item.ciudad || item.ciudad_prospecto || "Palmira";
                let diaPago = item.dia_pago || "---";
                let fechaVenta = item.fecha_venta || item.fec_vinc || item.fecha_compra || item.mes_compra || "";
                let notaCobro = item.nota_cobro || item.nota_seguimiento || item.observaciones || "";
                let estadoStr = (item.estado || "").toLowerCase();

                let badgeClass = "badge-yellow";
                let badgeText = "EN GESTIÓN";
                let tarjetaEstiloClase = "";

                let esNoRenueva = estadoStr.includes("no renueva") || estadoStr.includes("no interesado") || estadoStr.includes("cancelado") || estadoStr.includes("❌");
                let esRenovado = item.yaRenovoComprado === true;

                if (esRenovado) {
                    tarjetaEstiloClase = "estado-renovado";
                    badgeClass = "badge-green";
                    badgeText = "✅ RENOVADO / LOGRADO";
                } else if (esNoRenueva) {
                    tarjetaEstiloClase = "estado-no-renueva";
                    badgeClass = "badge-orange";
                    badgeText = "❌ NO RENUEVA";
                } else if (vistaActual === 'cobros') {
                    let diaNum = parseInt(diaPago, 10);
                    let esDelDia = !isNaN(diaNum) && diaNum === diaActualNum;

                    if (esDelDia) {
                        badgeClass = "badge-green";
                        badgeText = `📅 COBRO HOY (DÍA ${diaPago})`;
                    } else {
                        badgeClass = "badge-red";
                        badgeText = `💳 DÍA DE COBRO: ${diaPago}`;
                    }
                } else if (vistaActual === 'afiliados' || vistaActual === 'difusion') {
                    badgeClass = "badge-purple";
                    badgeText = `🗂️ BASE COMERCIAL`;
                } else if (vistaActual === 'renovaciones') {
                    badgeClass = "badge-yellow";
                    badgeText = fechaVenta ? `🗓️ COMPRA: ${String(fechaVenta).toUpperCase()}` : `⏳ RENOVACIÓN`;
                }

                let numLimpio = String(celular).replace(/\D/g, '');
                if (numLimpio.length === 10) numLimpio = '57' + numLimpio;
                
                let primerNombre = nombre.split(' ')[0];
                primerNombre = primerNombre.charAt(0).toUpperCase() + primerNombre.slice(1).toLowerCase();

                // CONSTRUCCIÓN DE MENSAJE
                let msgWpp = "";
                let hora = fechaHoy.getHours();
                let saludoTiempo = "¡Feliz día! ☀️";
                let deseoCobro = "feliz día";

                if (hora >= 12 && hora < 19) {
                    saludoTiempo = "¡Feliz tarde! ☀️";
                    deseoCobro = "feliz tarde";
                } else if (hora >= 19 || hora < 5) {
                    saludoTiempo = "¡Feliz noche! 🌙";
                    deseoCobro = "feliz noche";
                }

                if (vistaActual === 'difusion' && mensajeDifusionCustom) {
                    // Mensaje de difusión personalizado redactado por el usuario
                    msgWpp = mensajeDifusionCustom.replace(/{nombre}/g, `*${primerNombre}*`);
                } else if (vistaActual === 'cobros') {
                    msgWpp = `hola ${primerNombre} 👋 espero estes muy bien ${deseoCobro}\nquedamos en que te recordara del pago hoy ${diaActualNum}.\n\nsi necesitas que te envie alguna cuenta o que te oriente con esto me avisas. 🙌`;
                } else {
                    msgWpp = `Hola, *${primerNombre}*. 😊 ¡Espero que te encuentres muy bien! ${saludoTiempo}\n\nEstaba revisando las afiliaciones que se renuevan este mes y vi que la tuya ya está próxima, por eso quise escribirte con tiempo.\n\nMe gustaría ayudarte para que continúes disfrutando de todos los beneficios, descuentos y auxilios de tu membresía Previser. 💙\n\nAntes de continuar, cuéntame una cosita. 😊\n\n¿Tu grupo familiar continúa igual o hubo algún cambio que quieras incluir este año?\n\nSi te parece, lo hacemos por aquí mismo o, si prefieres, agendamos una llamada. ¿Qué te queda más cómodo? 🤝`;
                }

                let urlWpp = `https://api.whatsapp.com/send?phone=${numLimpio}&text=${encodeURIComponent(msgWpp)}`;

                let valorSelectAccion = "lista";
                if (esRenovado) valorSelectAccion = "renovado";
                else if (esNoRenueva) valorSelectAccion = "no_renueva";

                let card = document.createElement('div');
                card.className = `card ${tarjetaEstiloClase}`;
                card.id = `card-doc-${item.idDoc}`;
                card.innerHTML = `
                    <div class="card-header">
                        <div class="card-title-group">
                            <span class="card-title">👤 ${nombre}</span>
                            <button class="btn-edit-note" title="Editar Nota / Observación" onclick="editarNotaEspecial('${item.idDoc}', '${item.coleccionOrigen}', '${nombre.replace(/'/g, "\\'")}', '${notaCobro.replace(/'/g, "\\'")}')">✏️</button>
                        </div>
                        <span class="badge ${badgeClass}">${badgeText}</span>
                    </div>
                    <div class="card-body">
                        <div>🪪 Cédula: <strong>${cedula}</strong></div>
                        <div>📞 <strong>${celular || 'Sin celular registrado'}</strong></div>
                        <div>🏢 ${empresa} | 📍 ${ciudad}</div>
                        ${fechaVenta ? `<div>🗓️ Fecha / Venta: <strong style="color:#fbbf24;">${String(fechaVenta).toUpperCase()}</strong></div>` : ''}
                        
                        <div style="display:flex; align-items:center; gap:6px; margin-top:4px;">
                            <span style="font-size:11px; font-weight:bold; color:#94a3b8;">Estado:</span>
                            <select class="select-accion" onchange="cambiarEstadoCliente('${item.idDoc}', '${item.coleccionOrigen}', this.value)">
                                <option value="lista" ${valorSelectAccion === 'lista' ? 'selected' : ''}>📋 En Lista / Gestión</option>
                                <option value="no_renueva" ${valorSelectAccion === 'no_renueva' ? 'selected' : ''}>❌ No Renueva</option>
                                <option value="renovado" ${valorSelectAccion === 'renovado' ? 'selected' : ''}>✅ Renovado / Venta</option>
                            </select>
                        </div>

                        <div id="nota-text-${item.idDoc}" style="color:#f472b6; font-style:italic; margin-top:4px;">
                            ${notaCobro ? `📝 ${notaCobro}` : '📝 Sin observaciones. (Toca el ✏️ para añadir)'}
                        </div>
                    </div>
                    <div class="card-actions">
                        <a href="${urlWpp}" target="_blank" class="btn btn-wpp">💬 WhatsApp ${vistaActual === 'difusion' ? 'Campañá' : ''}</a>
                        <a href="tel:${celular}" class="btn btn-call">📞 Llamar</a>
                    </div>
                `;
                contenedor.appendChild(card);
            });
        }

        async function cambiarEstadoCliente(idDoc, coleccion, nuevoValor) {
            try {
                let textoEstadoBD = "En lista";
                if (nuevoValor === "no_renueva") textoEstadoBD = "No renueva";
                else if (nuevoValor === "renovado") textoEstadoBD = "Afiliado / Renovado";

                await db.collection(coleccion).doc(idDoc).update({
                    estado: textoEstadoBD
                });

                let tarjeta = document.getElementById(`card-doc-${idDoc}`);
                if (tarjeta) {
                    tarjeta.classList.remove('estado-no-renueva', 'estado-renovado');
                    if (nuevoValor === "no_renueva") {
                        tarjeta.classList.add('estado-no-renueva');
                    } else if (nuevoValor === "renovado") {
                        tarjeta.classList.add('estado-renovado');
                    }
                }

                alert(`✅ Estado actualizado a: "${textoEstadoBD}". Sincronizado con la extensión.`);
            } catch (err) {
                alert("❌ Error al actualizar el estado: " + err.message);
            }
        }

        async function editarNotaEspecial(idDoc, coleccion, nombre, notaActual) {
            let nuevaNota = prompt(`📝 Escribe la nota o estado para:\n👤 ${nombre}`, notaActual);
            
            if (nuevaNota === null) return;

            try {
                let campoNota = (coleccion === 'afiliados') ? 'nota_cobro' : 'nota_seguimiento';
                
                let updateObj = {};
                updateObj[campoNota] = nuevaNota.trim();

                await db.collection(coleccion).doc(idDoc).update(updateObj);

                let elNota = document.getElementById(`nota-text-${idDoc}`);
                if (elNota) {
                    elNota.innerHTML = nuevaNota.trim() ? `📝 ${nuevaNota.trim()}` : '📝 Sin observaciones. (Toca el ✏️ para añadir)';
                }

                alert("✅ Nota actualizada correctamente.");
            } catch (err) {
                alert("❌ Error al actualizar la nota: " + err.message);
            }
        }

        function filtrarLista() {
            let valorRaw = document.getElementById('input-buscar').value.trim();
            let campo = document.getElementById('select-criterio').value;

            let textMesAbreviado = "";
            if (campo === "mes_compra" && valorRaw) {
                const diccionarioTextoMes = {
                    'enero': 'ene', 'ene': 'ene', 'febrero': 'feb', 'feb': 'feb', 'marzo': 'mar', 'mar': 'mar',
                    'abril': 'abr', 'abr': 'abr', 'mayo': 'may', 'may': 'may', 'junio': 'jun', 'jun': 'jun',
                    'julio': 'jul', 'jul': 'jul', 'agosto': 'ago', 'ago': 'ago', 'septiembre': 'sep', 'sep': 'sep',
                    'octubre': 'oct', 'oct': 'oct', 'noviembre': 'nov', 'nov': 'nov', 'diciembre': 'dic', 'dic': 'dic'
                };
                textMesAbreviado = diccionarioTextoMes[valorRaw.toLowerCase().trim()] || "";
            }

            let filtrados = registrosGlobales.filter(data => {
                if (!valorRaw) return true;

                if (campo === "mes_compra") {
                    let fechaVentaBD = String(data.fecha_venta || data.fec_vinc || data.fecha_compra || data.mes_compra || "").toLowerCase().trim();
                    return textMesAbreviado ? fechaVentaBD.includes(textMesAbreviado) : fechaVentaBD.includes(valorRaw.toLowerCase().trim());
                } else if (campo === "titular") {
                    let nombreBD = String(data.titular || data.nombre || data.nombreCompleto || data.cliente || "").toLowerCase().trim();
                    return nombreBD.includes(valorRaw.toLowerCase().trim());
                } else if (campo === "cedula") {
                    let cedulaBD = String(data.cedula || data.cedula_cliente || data.cedula_prospecto || data.idDoc || "").toLowerCase().trim();
                    return cedulaBD.includes(valorRaw.toLowerCase().trim());
                } else if (campo === "empresa") {
                    let empresaBD = String(data.empresa || data.convenio || data.empresa_interes || "").toLowerCase().trim();
                    return empresaBD.includes(valorRaw.toLowerCase().trim());
                } else if (campo === "ciudad") {
                    let ciudadBD = String(data.ciudad || data.ciudad_prospecto || "").toLowerCase().trim();
                    return ciudadBD.includes(valorRaw.toLowerCase().trim());
                } else {
                    let textoCompleto = JSON.stringify(data).toLowerCase();
                    return textoCompleto.includes(valorRaw.toLowerCase().trim());
                }
            });

            filtrados.sort((a, b) => {
                let diaA = extraerDiaNum(a);
                let diaB = extraerDiaNum(b);
                return ordenVencimientoAsc ? (diaA - diaB) : (diaB - diaA);
            });

            renderizarTarjetas(filtrados);
        }

        function activarHeyAndru() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("Tu navegador no soporta comandos por voz. Intenta con Chrome Móvil.");
                return;
            }

            const recognition = new SpeechRecognition();
            recognition.lang = 'es-CO';
            recognition.interimResults = false;

            const btnVoz = document.getElementById('btn-hey-andru');
            btnVoz.classList.add('listening');

            recognition.start();

            recognition.onresult = function(event) {
                btnVoz.classList.remove('listening');
                let comando = event.results[0][0].transcript.toLowerCase().trim();

                let inputBuscar = document.getElementById('input-buscar');
                let selectCriterio = document.getElementById('select-criterio');

                const LISTA_MESES = [
                    "enero", "febrero", "marzo", "abril", "mayo", "junio", 
                    "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"
                ];

                let mesDetectado = LISTA_MESES.find(m => comando.includes(m));

                if (mesDetectado || comando.includes('renovacion') || comando.includes('renovaciones')) {
                    let mesLimpio = mesDetectado ? mesDetectado : comando
                        .replace(/hey andrew|hey andru|andrew|andru/g, '')
                        .replace(/muéstrame|muestrame|muestra|busca|buscar|filtra|filtrar|mis/g, '')
                        .replace(/renovaciones del mes de|renovaciones de|renovaciones del|renovaciones/g, '')
                        .replace(/del mes de|del mes|mes de|mes del|mes/g, '')
                        .trim();

                    selectCriterio.value = 'mes_compra';
                    inputBuscar.value = mesLimpio;
                    cambiarVista('renovaciones');

                } else if (comando.includes('cobro') || comando.includes('cartera')) {
                    if (comando.includes('postergado')) {
                        subFiltroCobros = 'POSTERGADOS';
                    } else if (comando.includes('todos') || comando.includes('pendiente')) {
                        subFiltroCobros = 'TODOS_PENDIENTES';
                    } else {
                        subFiltroCobros = 'DIA_ACTUAL';
                    }
                    inputBuscar.value = '';
                    selectCriterio.value = 'todo';
                    cambiarVista('cobros');

                } else if (comando.includes('empresa') || comando.includes('convenio')) {
                    let emp = comando.replace(/hey andrew|hey andru|muéstrame|muestrame|muestra|mis clientes de la empresa|empresa|convenio/g, '').trim();
                    selectCriterio.value = 'empresa';
                    inputBuscar.value = emp;
                    cambiarVista('afiliados');

                } else if (comando.includes('cliente') || comando.includes('titular') || comando.includes('nombre')) {
                    let nom = comando.replace(/hey andrew|hey andru|muéstrame|muestrame|muestra|mis clientes|cliente|titular|nombre/g, '').trim();
                    selectCriterio.value = 'titular';
                    inputBuscar.value = nom;
                    cambiarVista('afiliados');

                } else {
                    let textoGen = comando
                        .replace(/hey andrew|hey andru|andrew|andru/g, '')
                        .replace(/muéstrame|muestrame|muestra|busca|buscar|filtra|filtrar|mis/g, '')
                        .trim();
                    selectCriterio.value = 'todo';
                    inputBuscar.value = textoGen;
                    cambiarVista('afiliados');
                }
            };

            recognition.onerror = function(e) {
                btnVoz.classList.remove('listening');
            };

            recognition.onend = function() {
                btnVoz.classList.remove('listening');
            };
        }

        function abrirModalNuevo() {
            document.getElementById('modal-prospecto').style.display = 'flex';
        }
        function cerrarModalNuevo() {
            document.getElementById('modal-prospecto').style.display = 'none';
        }

        async function guardarProspecto() {
            let nombre = document.getElementById('nuevo-nombre').value.trim();
            let celular = document.getElementById('nuevo-celular').value.trim();
            let ciudad = document.getElementById('nuevo-ciudad').value.trim();
            let empresa = document.getElementById('nuevo-empresa').value.trim();
            let nota = document.getElementById('nuevo-nota').value.trim();

            if (!nombre || !celular) {
                alert("Por favor ingresa al menos el Nombre y el Celular.");
                return;
            }

            try {
                let nuevoDoc = {
                    nombre: nombre,
                    celular: celular,
                    ciudad_prospecto: ciudad || "Palmira",
                    empresa_interes: empresa || "Independiente",
                    nota_seguimiento: nota || "Ingresado desde la Web App Móvil",
                    fecha_registro: new Date().toISOString(),
                    origen: "App Movil"
                };

                await db.collection("prospectos").add(nuevoDoc);
                alert("✅ Prospecto guardado con éxito en Firebase.");
                
                document.getElementById('nuevo-nombre').value = '';
                document.getElementById('nuevo-celular').value = '';
                document.getElementById('nuevo-nota').value = '';
                cerrarModalNuevo();

                if (vistaActual === 'prospectos') {
                    cargarDatosMovil();
                }
            } catch (err) {
                alert("❌ Error al guardar: " + err.message);
            }
        }

        cargarDatosMovil();
    </script>
</body>
</html>
