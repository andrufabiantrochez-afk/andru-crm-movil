<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Andru CRM - Móvil</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e293b">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">

    <!-- Firebase SDKs Estables -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #0f172a; color: #f8fafc; padding-bottom: 90px; }
        header { background: #1e293b; padding: 15px; border-bottom: 2px solid #6366f1; position: sticky; top: 0; z-index: 100; display: flex; justify-content: space-between; align-items: center; }
        h1 { font-size: 16px; color: #818cf8; display: flex; align-items: center; gap: 6px; }
        
        .search-container { padding: 10px 15px; background: #1e293b; border-bottom: 1px solid #334155; display: flex; gap: 8px; flex-direction: column; }
        .search-row { display: flex; gap: 8px; }
        .filter-select { background: #0f172a; color: #38bdf8; border: 1px solid #475569; border-radius: 8px; padding: 8px 10px; font-size: 12px; font-weight: bold; outline: none; }
        .search-input { flex: 1; padding: 10px 14px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 13px; outline: none; }

        .btn-orden { background: #312e81; color: #38bdf8; border: 1px solid #4338ca; padding: 6px 12px; border-radius: 8px; font-size: 11px; font-weight: bold; cursor: pointer; }

        .nav-tabs { display: flex; background: #1e293b; padding: 8px 15px; gap: 8px; overflow-x: auto; border-bottom: 1px solid #334155; }
        .tab-btn { background: #0f172a; color: #94a3b8; border: 1px solid #334155; padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; white-space: nowrap; cursor: pointer; }
        .tab-btn.active { background: #6366f1; color: white; border-color: #6366f1; }
        
        .sub-nav { display: flex; gap: 6px; padding: 8px 15px; background: #0f172a; border-bottom: 1px solid #1e293b; }
        .sub-btn { background: #1e293b; color: #94a3b8; border: 1px solid #334155; padding: 5px 10px; border-radius: 12px; font-size: 11px; font-weight: bold; cursor: pointer; }
        .sub-btn.active { background: #3b82f6; color: white; border-color: #3b82f6; }

        .container { padding: 12px; display: flex; flex-direction: column; gap: 10px; }
        
        .card { background: #1e293b; border-radius: 12px; padding: 14px; border: 1px solid #334155; display: flex; flex-direction: column; gap: 8px; }
        .card.estado-no-renueva { background: rgba(249, 115, 22, 0.15) !important; border: 1px solid #ea580c !important; }
        .card.estado-renovado { background: rgba(16, 185, 129, 0.15) !important; border: 1px solid #059669 !important; }

        .card-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 6px; }
        .card-title { font-size: 14px; font-weight: bold; color: #fff; }
        .btn-edit-note { background: none; border: none; cursor: pointer; font-size: 12px; color: #38bdf8; }

        .select-accion { background: #0f172a; color: #fbbf24; border: 1px solid #475569; border-radius: 6px; padding: 3px 6px; font-size: 10px; font-weight: bold; outline: none; }

        .badge { font-size: 10px; padding: 3px 8px; border-radius: 6px; font-weight: bold; white-space: nowrap; }
        .badge-red { background: rgba(239,68,68,0.2); color: #f87171; border: 1px solid rgba(239,68,68,0.4); }
        .badge-orange { background: rgba(249,115,22,0.2); color: #fb923c; border: 1px solid rgba(249,115,22,0.4); }
        .badge-yellow { background: rgba(245,158,11,0.2); color: #fbbf24; border: 1px solid rgba(245,158,11,0.4); }
        .badge-green { background: rgba(16,185,129,0.2); color: #34d399; border: 1px solid rgba(16,185,129,0.4); }
        .badge-purple { background: rgba(168,85,247,0.2); color: #c084fc; border: 1px solid rgba(168,85,247,0.4); }
        
        .card-body { font-size: 12px; color: #cbd5e1; display: flex; flex-direction: column; gap: 4px; }
        .card-actions { display: flex; gap: 6px; margin-top: 6px; }
        .btn { flex: 1; padding: 8px 4px; border-radius: 8px; border: none; font-size: 11px; font-weight: bold; cursor: pointer; text-align: center; display: flex; align-items: center; justify-content: center; text-decoration: none; }
        .btn-wpp { background: #059669; color: white; }
        .btn-call { background: #0284c7; color: white; }
        .btn-cal { background: #7c3aed; color: white; }

        .difusion-panel { background: #1e293b; border-radius: 12px; padding: 12px; border: 1px solid #3b82f6; display: flex; flex-direction: column; gap: 8px; }
        .textarea-msg { width: 100%; height: 80px; background: #0f172a; color: #fff; border: 1px solid #475569; border-radius: 8px; padding: 8px; font-size: 12px; outline: none; }

        .fab-btn { position: fixed; bottom: 20px; right: 20px; background: #6366f1; color: white; width: 54px; height: 54px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; border: none; z-index: 99; }
        .voice-btn { position: fixed; bottom: 20px; left: 20px; background: #0284c7; color: white; width: 54px; height: 54px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 22px; border: none; z-index: 99; }
        
        .modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index: 1000; align-items:center; justify-content:center; padding:15px; }
        .modal-content { background: #1e293b; width:100%; max-width:400px; border-radius:14px; padding:20px; border:1px solid #475569; display:flex; flex-direction:column; gap:12px; }
        .form-group { display:flex; flex-direction:column; gap:4px; }
        .form-group label { font-size:11px; color:#94a3b8; font-weight:bold; }
        .form-input { padding:9px; border-radius:6px; border:1px solid #334155; background:#0f172a; color:#fff; font-size:13px; outline:none; }
        .btn-save { background:#6366f1; color:white; padding:10px; border-radius:8px; border:none; font-weight:bold; font-size:13px; cursor:pointer; }
        
        .loading { text-align: center; padding: 30px; color: #38bdf8; font-size: 13px; }
    </style>
</head>
<body>

    <header>
        <h1>🎯 Andru CRM <span style="font-size:9px; background:#6366f1; padding:1px 5px; border-radius:4px;">MÓVIL</span></h1>
        <span id="total-registros" style="font-size:11px; color:#94a3b8;">Cargando...</span>
    </header>

    <div class="search-container">
        <div class="search-row">
            <select id="select-criterio" class="filter-select" onchange="filtrarLista()">
                <option value="todo">🔍 Todo (General)</option>
                <option value="mes_compra">📅 Mes de Compra</option>
                <option value="titular">👤 Titular / Nombre</option>
                <option value="cedula">🪪 Cédula</option>
                <option value="empresa">🏢 Empresa / Convenio</option>
                <option value="ciudad">📍 Ciudad</option>
            </select>
            <input type="text" id="input-buscar" class="search-input" placeholder="Escribe para buscar..." oninput="filtrarLista()">
        </div>
        <button id="btn-ordenar-dia" class="btn-orden" onclick="alternarOrdenVencimiento()">
            📅 Ordenar por Día Vencimiento (1 al 31)
        </button>
    </div>

    <div class="nav-tabs">
        <button class="tab-btn active" id="tab-btn-cobros" onclick="cambiarVista('cobros')">💰 Cobros del Día</button>
        <button class="tab-btn" id="tab-btn-afiliados" onclick="cambiarVista('afiliados')">🗂️ Base Afiliados</button>
        <button class="tab-btn" id="tab-btn-comercial" style="color:#fbbf24;" onclick="cambiarVista('comercial')">🎁 Base Comercial (Bonos)</button>
        <button class="tab-btn" id="tab-btn-renovaciones" onclick="cambiarVista('renovaciones')">⏳ Renovaciones</button>
        <button class="tab-btn" id="tab-btn-prospectos" onclick="cambiarVista('prospectos')">👤 Prospectos</button>
        <button class="tab-btn" id="tab-btn-ganados" onclick="cambiarVista('ganados')">✅ Ventas Logradas</button>
        <button class="tab-btn" id="tab-btn-difusion" style="color:#60a5fa;" onclick="cambiarVista('difusion')">📢 Difusión Comercial</button>
    </div>

    <div class="sub-nav" id="subnav-cobros">
        <button class="sub-btn active" id="btn-sub-dia" onclick="cambiarSubFiltroCobros('DIA_ACTUAL')">📅 Del Día</button>
        <button class="sub-btn" id="btn-sub-postergados" onclick="cambiarSubFiltroCobros('POSTERGADOS')">⏳ Postergados</button>
        <button class="sub-btn" id="btn-sub-todos" onclick="cambiarSubFiltroCobros('TODOS_PENDIENTES')">📋 Todos con Día</button>
    </div>

    <div class="container">
        <div id="panel-difusion-comercial" class="difusion-panel" style="display:none;">
            <div style="font-size:13px; font-weight:bold; color:#60a5fa;">📢 Redactar Mensaje de Campaña</div>
            <textarea id="texto-difusion-custom" class="textarea-msg" placeholder="Escribe tu mensaje... Usa {nombre} para personalizar."></textarea>
            <button class="btn btn-wpp" style="padding:8px;" onclick="aplicarMensajeDifusion()">🚀 Generar Lista de Envío</button>
        </div>

        <div id="lista-tarjetas">
            <div class="loading">⏳ Conectando con Firebase...</div>
        </div>
    </div>

    <button class="voice-btn" id="btn-hey-andru" title="Dictar Comando" onclick="activarHeyAndru()">🎙️</button>
    <button class="fab-btn" title="Nuevo Prospecto" onclick="abrirModalNuevo()">＋</button>

    <div class="modal" id="modal-prospecto">
        <div class="modal-content">
            <div style="font-size:15px; font-weight:bold; color:#fff; display:flex; justify-between; align-items:center;">
                <span>👤 Nuevo Prospecto</span>
                <span style="cursor:pointer;" onclick="cerrarModalNuevo()">✕</span>
            </div>
            <div class="form-group">
                <label>Nombre Completo *</label>
                <input type="text" id="nuevo-nombre" class="form-input" placeholder="Ej: Maria Lopez">
            </div>
            <div class="form-group">
                <label>Celular / WhatsApp *</label>
                <input type="tel" id="nuevo-celular" class="form-input" placeholder="Ej: 3181234567">
            </div>
            <div class="form-group">
                <label>Ciudad</label>
                <input type="text" id="nuevo-ciudad" class="form-input" value="Palmira">
            </div>
            <div class="form-group">
                <label>Empresa / Convenio</label>
                <input type="text" id="nuevo-empresa" class="form-input" placeholder="Ej: PROMEDICOS">
            </div>
            <div class="form-group">
                <label>Observaciones / Nota</label>
                <input type="text" id="nuevo-nota" class="form-input" placeholder="Nota rápida...">
            </div>
            <button class="btn-save" onclick="guardarProspecto()">💾 Guardar en Firebase</button>
        </div>
    </div>

    <script>
        var firebaseConfig = {
          apiKey: "AIzaSyBP4F7vQAMmXTWTRMSUSn7m4jdsiFRhnHU",
          authDomain: "andru-cmr-previser.firebaseapp.com",
          projectId: "andru-cmr-previser",
          storageBucket: "andru-cmr-previser.firebasestorage.app",
          messagingSenderId: "29995729300",
          appId: "1:29995729300:web:627108678d6c57eebe8f81"
        };

        firebase.initializeApp(firebaseConfig);
        var db = firebase.firestore();

        var vistaActual = 'cobros';
        var subFiltroCobros = 'DIA_ACTUAL';
        var registrosGlobales = [];
        var ordenVencimientoAsc = true;
        var mensajeDifusionCustom = "";

        function cambiarVista(vista) {
            vistaActual = vista;
            var btns = document.querySelectorAll('.tab-btn');
            for(var i=0; i<btns.length; i++) { btns[i].classList.remove('active'); }
            
            var btnActivo = document.getElementById('tab-btn-' + vista);
            if(btnActivo) btnActivo.classList.add('active');
            
            document.getElementById('subnav-cobros').style.display = (vista === 'cobros') ? 'flex' : 'none';
            document.getElementById('panel-difusion-comercial').style.display = (vista === 'difusion') ? 'flex' : 'none';

            if (vista === 'renovaciones') {
                document.getElementById('select-criterio').value = 'mes_compra';
            } else {
                document.getElementById('select-criterio').value = 'todo';
            }

            cargarDatosMovil();
        }

        function cambiarSubFiltroCobros(subFiltro) {
            subFiltroCobros = subFiltro;
            var btns = document.querySelectorAll('.sub-btn');
            for(var i=0; i<btns.length; i++) { btns[i].classList.remove('active'); }
            
            if (subFiltro === 'DIA_ACTUAL') document.getElementById('btn-sub-dia').classList.add('active');
            if (subFiltro === 'POSTERGADOS') document.getElementById('btn-sub-postergados').classList.add('active');
            if (subFiltro === 'TODOS_PENDIENTES') document.getElementById('btn-sub-todos').classList.add('active');
            cargarDatosMovil();
        }

        function alternarOrdenVencimiento() {
            ordenVencimientoAsc = !ordenVencimientoAsc;
            var btn = document.getElementById('btn-ordenar-dia');
            btn.innerText = ordenVencimientoAsc ? '📅 Ordenar por Día Vencimiento (1 al 31)' : '📅 Ordenar por Día Vencimiento (31 al 1)';
            filtrarLista();
        }

        function extraerDiaNum(item) {
            var dia = parseInt(item.dia_pago, 10);
            if (!isNaN(dia)) return dia;
            var fechaStr = String(item.fecha_venta || item.fec_vinc || item.fecha_compra || "");
            var match = fechaStr.match(/\b([0-2]?[0-9]|3[01])\b/);
            if (match) return parseInt(match[1], 10);
            return 99;
        }

        function aplicarMensajeDifusion() {
            var txt = document.getElementById('texto-difusion-custom').value.trim();
            if (!txt) return alert("Ingresa un mensaje.");
            mensajeDifusionCustom = txt;
            filtrarLista();
        }

        function agendarEnCalendar(itemIndex) {
            var item = registrosGlobales[itemIndex];
            if (!item) return;
            var nombre = String(item.titular || item.nombre || item.nombreCompleto || "Cliente").toUpperCase();
            var primerNombre = nombre.split(' ')[0];
            primerNombre = primerNombre.charAt(0).toUpperCase() + primerNombre.slice(1).toLowerCase();
            
            var celular = item.celular || item.telefono || "";
            var empresa = item.empresa || item.convenio || "Previser";
            var ciudad = item.ciudad || "Palmira";
            var nota = item.nota_cobro || item.nota_seguimiento || item.observaciones || "";

            var titulo = "📞 Llamar a " + primerNombre + " (" + empresa + ")";
            var detalles = "👤 Cliente: " + nombre + "\n📱 Celular: " + celular + "\n🏢 Empresa: " + empresa + "\n📍 Ciudad: " + ciudad + "\n📝 Nota: " + nota;
            
            var ahora = new Date();
            ahora.setHours(ahora.getHours() + 1);
            var isoInicio = ahora.toISOString().replace(/-|:|\.\d\d\d/g, "");
            var enTreinta = new Date(ahora.getTime() + 30 * 60000);
            var isoFin = enTreinta.toISOString().replace(/-|:|\.\d\d\d/g, "");
            
            var url = "https://calendar.google.com/calendar/render?action=TEMPLATE&text=" + encodeURIComponent(titulo) + "&details=" + encodeURIComponent(detalles) + "&dates=" + isoInicio + "/" + isoFin;
            window.open(url, '_blank');
        }

        async function cargarDatosMovil() {
            var contenedor = document.getElementById('lista-tarjetas');
            contenedor.innerHTML = '<div class="loading">⏳ Consultando datos de Firebase...</div>';

            try {
                var mapaCedulas = {};
                if (vistaActual === 'renovaciones' || vistaActual === 'ganados') {
                    var snapA = await db.collection("afiliados").get();
                    snapA.forEach(function(docA) {
                        var dataA = docA.data();
                        var ced = String(dataA.cedula || dataA.cedula_cliente || "").trim().replace(/^0+/, '');
                        if (ced) mapaCedulas[ced] = true;
                    });
                }

                registrosGlobales = [];
                var diaActualNum = (new Date()).getDate();

                // MULTI-CONSULTA PARA LA VISTA COMERCIAL (baseComercial / bonos)
                if (vistaActual === 'comercial') {
                    var coleccionesComerciales = ["baseComercial", "bonos", "base_comercial"];
                    for (var c = 0; c < coleccionesComerciales.length; c++) {
                        try {
                            var snapC = await db.collection(coleccionesComerciales[c]).get();
                            snapC.forEach(function(doc) {
                                var d = doc.data();
                                d.idDoc = doc.id;
                                d.coleccionOrigen = coleccionesComerciales[c];
                                registrosGlobales.push(d);
                            });
                        } catch (eCom) {
                            console.log("Colección " + coleccionesComerciales[c] + " no encontrada o vacía.");
                        }
                    }

                    // Si no hay documentos en colecciones independientes, consulta 'afiliados' con origen comercial
                    if (registrosGlobales.length === 0) {
                        var snapAf = await db.collection("afiliados").get();
                        snapAf.forEach(function(doc) {
                            var d = doc.data();
                            var tipo = (d.tipo || d.origen || d.categoria || "").toLowerCase();
                            if (tipo.indexOf("bono") !== -1 || tipo.indexOf("comercial") !== -1 || d.bono) {
                                d.idDoc = doc.id;
                                d.coleccionOrigen = "afiliados";
                                registrosGlobales.push(d);
                            }
                        });
                    }

                } else {
                    var coleccion = 'afiliados';
                    if (vistaActual === 'renovaciones' || vistaActual === 'ganados') coleccion = 'renovaciones';
                    else if (vistaActual === 'prospectos') coleccion = 'prospectos';
                    else if (vistaActual === 'difusion') coleccion = 'afiliados';

                    var snapshot = await db.collection(coleccion).get();

                    snapshot.forEach(function(doc) {
                        var d = doc.data();
                        d.idDoc = doc.id;
                        d.coleccionOrigen = coleccion;

                        var est = (d.estado || "").toLowerCase();
                        var cedulaLimpia = String(d.cedula || d.cedula_cliente || d.cedula_prospecto || "").trim().replace(/^0+/, '');
                        var yaRenovo = (mapaCedulas[cedulaLimpia] === true) || d.archivado === true || est.indexOf("afiliado") !== -1 || est.indexOf("renovado") !== -1;
                        d.yaRenovoComprado = yaRenovo;

                        if (vistaActual === 'cobros') {
                            var diaCobroNum = parseInt(String(d.dia_pago || "").trim(), 10);
                            var estadoCobro = (d.estado_cobro || "").toLowerCase();

                            if (!isNaN(diaCobroNum) && diaCobroNum >= 1 && diaCobroNum <= 31) {
                                var esDelDia = diaCobroNum === diaActualNum;
                                var esPostergado = estadoCobro.indexOf("postergado") !== -1 || estadoCobro.indexOf("pendiente") !== -1 || diaCobroNum < diaActualNum;

                                var incluir = false;
                                if (subFiltroCobros === 'DIA_ACTUAL' && esDelDia && estadoCobro.indexOf("pagado") === -1) incluir = true;
                                else if (subFiltroCobros === 'POSTERGADOS' && esPostergado && !esDelDia && estadoCobro.indexOf("pagado") === -1) incluir = true;
                                else if (subFiltroCobros === 'TODOS_PENDIENTES' && estadoCobro.indexOf("pagado") === -1) incluir = true;

                                if (incluir) registrosGlobales.push(d);
                            }
                        } else if (vistaActual === 'afiliados' || vistaActual === 'difusion') {
                            registrosGlobales.push(d);
                        } else {
                            if (vistaActual === 'ganados' && yaRenovo) registrosGlobales.push(d);
                            else if (vistaActual === 'renovaciones') registrosGlobales.push(d);
                            else if (vistaActual === 'prospectos') registrosGlobales.push(d);
                        }
                    });
                }

                filtrarLista();

            } catch (err) {
                contenedor.innerHTML = '<div class="loading" style="color:#f87171;">❌ Error al cargar: ' + err.message + '</div>';
            }
        }

        function renderizarTarjetas(lista) {
            var contenedor = document.getElementById('lista-tarjetas');
            var contador = document.getElementById('total-registros');
            contenedor.innerHTML = '';
            contador.innerText = lista.length + ' registros';

            if (lista.length === 0) {
                contenedor.innerHTML = '<div class="loading" style="color:#94a3b8;">🎉 No hay registros para este filtro.</div>';
                return;
            }

            var diaActualNum = (new Date()).getDate();

            lista.forEach(function(item, index) {
                var nombre = String(item.titular || item.nombre || item.nombreCompleto || item.cliente || "Sin Nombre").toUpperCase();
                var cedula = item.cedula || item.cedula_cliente || item.cedula_prospecto || item.idDoc || "---";
                var celular = String(item.celular || item.telefono || item.movil || "");
                var empresa = item.empresa || item.convenio || item.empresa_interes || "No vinculado";
                var ciudad = item.ciudad || item.ciudad_prospecto || "Palmira";
                var diaPago = item.dia_pago || "---";
                var fechaVenta = item.fecha_venta || item.fec_vinc || item.fecha_compra || item.mes_compra || "";
                var notaCobro = item.nota_cobro || item.nota_seguimiento || item.observaciones || "";
                var estadoStr = (item.estado || "").toLowerCase();

                var badgeClass = "badge-yellow";
                var badgeText = "EN GESTIÓN";
                var tarjetaEstiloClase = "";

                var esNoRenueva = estadoStr.indexOf("no renueva") !== -1 || estadoStr.indexOf("no interesado") !== -1 || estadoStr.indexOf("cancelado") !== -1;
                var esRenovado = item.yaRenovoComprado === true;

                if (esRenovado) {
                    tarjetaEstiloClase = "estado-renovado";
                    badgeClass = "badge-green";
                    badgeText = "✅ RENOVADO";
                } else if (esNoRenueva) {
                    tarjetaEstiloClase = "estado-no-renueva";
                    badgeClass = "badge-orange";
                    badgeText = "❌ NO RENUEVA";
                } else if (vistaActual === 'cobros') {
                    var diaNum = parseInt(diaPago, 10);
                    if (!isNaN(diaNum) && diaNum === diaActualNum) {
                        badgeClass = "badge-green";
                        badgeText = "📅 COBRO HOY (" + diaPago + ")";
                    } else {
                        badgeClass = "badge-red";
                        badgeText = "💳 DÍA COBRO: " + diaPago;
                    }
                } else if (vistaActual === 'comercial') {
                    badgeClass = "badge-yellow";

        function filtrarLista() {
            var valorRaw = document.getElementById('input-buscar').value.trim();
            var campo = document.getElementById('select-criterio').value;

            var textMesAbreviado = "";
            if (campo === "mes_compra" && valorRaw) {
                var diccionarioMes = {
                    'enero': 'ene', 'ene': 'ene', 'febrero': 'feb', 'feb': 'feb', 'marzo': 'mar', 'mar': 'mar',
                    'abril': 'abr', 'abr': 'abr', 'mayo': 'may', 'may': 'may', 'junio': 'jun', 'jun': 'jun',
                    'julio': 'jul', 'jul': 'jul', 'agosto': 'ago', 'ago': 'ago', 'septiembre': 'sep', 'sep': 'sep',
                    'octubre': 'oct', 'oct': 'oct', 'noviembre': 'nov', 'nov': 'nov', 'diciembre': 'dic', 'dic': 'dic'
                };
                textMesAbreviado = diccionarioMes[valorRaw.toLowerCase().trim()] || "";
            }

            var filtrados = registrosGlobales.filter(function(data) {
                if (!valorRaw) return true;

                if (campo === "mes_compra") {
                    var f = String(data.fecha_venta || data.fec_vinc || data.fecha_compra || data.mes_compra || "").toLowerCase().trim();
                    return textMesAbreviado ? f.indexOf(textMesAbreviado) !== -1 : f.indexOf(valorRaw.toLowerCase().trim()) !== -1;
                } else if (campo === "titular") {
                    var n = String(data.titular || data.nombre || data.nombreCompleto || data.cliente || "").toLowerCase().trim();
                    return n.indexOf(valorRaw.toLowerCase().trim()) !== -1;
                } else if (campo === "cedula") {
                    var c = String(data.cedula || data.cedula_cliente || data.cedula_prospecto || data.idDoc || "").toLowerCase().trim();
                    return c.indexOf(valorRaw.toLowerCase().trim()) !== -1;
                } else if (campo === "empresa") {
                    var e = String(data.empresa || data.convenio || data.empresa_interes || "").toLowerCase().trim();
                    return e.indexOf(valorRaw.toLowerCase().trim()) !== -1;
                } else if (campo === "ciudad") {
                    var ci = String(data.ciudad || data.ciudad_prospecto || "").toLowerCase().trim();
                    return ci.indexOf(valorRaw.toLowerCase().trim()) !== -1;
                } else {
                    return JSON.stringify(data).toLowerCase().indexOf(valorRaw.toLowerCase().trim()) !== -1;
                }
            });

            filtrados.sort(function(a, b) {
                var diaA = extraerDiaNum(a);
                var diaB = extraerDiaNum(b);
                return ordenVencimientoAsc ? (diaA - diaB) : (diaB - diaA);
            });

            renderizarTarjetas(filtrados);
        }

        function extraerDiaNum(item) {
            var dia = parseInt(item.dia_pago, 10);

            var fechaStr = String(item.fecha_venta || item.fec_vinc || item.fecha_compra || "");

            if (match) return parseInt(match[1], 10);
            return 99;
        }

        function agendarEnCalendar(itemIndex) {
            var item = registrosGlobales[itemIndex];

        async function cargarDatosMovil() {
            var contenedor = document.getElementById('lista-tarjetas');
            contenedor.innerHTML = '<div class="loading">⏳ Consultando datos de Firebase...</div>';

            try {
                var mapaCedulas = {};
                if (vistaActual === 'renovaciones' || vistaActual === 'ganados') {
                    var snapA = await db.collection("afiliados").get();
                    snapA.forEach(function(docA) {
                        var dataA = docA.data();
                        var ced = String(dataA.cedula || dataA.cedula_cliente || "").trim().replace(/^0+/, '');
                        if (ced) mapaCedulas[ced] = true;
                    });
                }

                registrosGlobales = [];
                var diaActualNum = (new Date()).getDate();

                // MULTI-CONSULTA PARA LA VISTA COMERCIAL (Incorpóro "prospectos_comerciales")
                if (vistaActual === 'comercial') {
                    var coleccionesComerciales = ["prospectos_comerciales", "baseComercial", "bonos", "base_comercial"];
                    for (var c = 0; c < coleccionesComerciales.length; c++) {
                        try {
                            var snapC = await db.collection(coleccionesComerciales[c]).get();
                            snapC.forEach(function(doc) {
                                var d = doc.data();
                                d.idDoc = doc.id;
                                d.coleccionOrigen = coleccionesComerciales[c];
                                registrosGlobales.push(d);
                            });
                        } catch (eCom) {
                            console.log("Colección " + coleccionesComerciales[c] + " no encontrada o vacía.");
                        }
                    }

                    if (registrosGlobales.length === 0) {
                        var snapAf = await db.collection("afiliados").get();
                        snapAf.forEach(function(doc) {
                            var d = doc.data();
                            var tipo = (d.tipo || d.origen || d.categoria || "").toLowerCase();
                            if (tipo.indexOf("bono") !== -1 || tipo.indexOf("comercial") !== -1 || d.bono) {
                                d.idDoc = doc.id;
                                d.coleccionOrigen = "afiliados";
                                registrosGlobales.push(d);
                            }
                        });
                    }

                } else {
                    var coleccion = 'afiliados';
                    if (vistaActual === 'renovaciones' || vistaActual === 'ganados') coleccion = 'renovaciones';
                    else if (vistaActual === 'prospectos') coleccion = 'prospectos';
                    else if (vistaActual === 'difusion') coleccion = 'afiliados';

                    var snapshot = await db.collection(coleccion).get();

                    snapshot.forEach(function(doc) {
                        var d = doc.data();
                        d.idDoc = doc.id;
                        d.coleccionOrigen = coleccion;

                        var est = (d.estado || "").toLowerCase();
                        var cedulaLimpia = String(d.cedula || d.cedula_cliente || d.cedula_prospecto || "").trim().replace(/^0+/, '');
                        var yaRenovo = (mapaCedulas[cedulaLimpia] === true) || d.archivado === true || est.indexOf("afiliado") !== -1 || est.indexOf("renovado") !== -1;
                        d.yaRenovoComprado = yaRenovo;

                        if (vistaActual === 'cobros') {
                            var diaCobroNum = parseInt(String(d.dia_pago || "").trim(), 10);
                            var estadoCobro = (d.estado_cobro || "").toLowerCase();

                            if (!isNaN(diaCobroNum) && diaCobroNum >= 1 && diaCobroNum <= 31) {
                                var esDelDia = diaCobroNum === diaActualNum;
                                var esPostergado = estadoCobro.indexOf("postergado") !== -1 || estadoCobro.indexOf("pendiente") !== -1 || diaCobroNum < diaActualNum;

                                var incluir = false;
                                if (subFiltroCobros === 'DIA_ACTUAL' && esDelDia && estadoCobro.indexOf("pagado") === -1) incluir = true;
                                else if (subFiltroCobros === 'POSTERGADOS' && esPostergado && !esDelDia && estadoCobro.indexOf("pagado") === -1) incluir = true;
                                else if (subFiltroCobros === 'TODOS_PENDIENTES' && estadoCobro.indexOf("pagado") === -1) incluir = true;

                                if (incluir) registrosGlobales.push(d);

                var tarjetaEstiloClase = "";

                var esNoRenueva = estadoStr.indexOf("no renueva") !== -1 || estadoStr.indexOf("no interesado") !== -1 || estadoStr.indexOf("cancelado") !== -1;
                var esRenovado = item.yaRenovoComprado === true;

                if (esRenovado) {
                    tarjetaEstiloClase = "estado-renovado";
                    badgeClass = "badge-green";
                    badgeText = "✅ RENOVADO";
                } else if (esNoRenueva) {
                    tarjetaEstiloClase = "estado-no-renueva";
                    badgeClass = "badge-orange";
                    badgeText = "❌ NO RENUEVA";
                } else if (vistaActual === 'cobros') {
                    var diaNum = parseInt(diaPago, 10);
                    if (!isNaN(diaNum) && diaNum === diaActualNum) {
                        badgeClass = "badge-green";
                        badgeText = "📅 COBRO HOY (" + diaPago + ")";
                    } else {
                        badgeClass = "badge-red";
                        badgeText = "💳 DÍA COBRO: " + diaPago;
                    }
                } else if (vistaActual === 'comercial') {
                    badgeClass = "badge-yellow";
                    badgeText = "🎁 BASE COMERCIAL / BONOS";
                } else if (vistaActual === 'afiliados' || vistaActual === 'difusion') {
                    badgeClass = "badge-purple";
                    badgeText = "🗂️ BASE AFILIADOS";
                } else if (vistaActual === 'renovaciones') {
                    badgeClass = "badge-yellow";
                    badgeText = fechaVenta ? "🗓️ COMPRA: " + String(fechaVenta).toUpperCase() : "⏳ RENOVACIÓN";
                }

                var numLimpio = String(celular).replace(/\D/g, '');
                if (numLimpio.length === 10) numLimpio = '57' + numLimpio;
                
                var primerNombre = nombre.split(' ')[0];
                primerNombre = primerNombre.charAt(0).toUpperCase() + primerNombre.slice(1).toLowerCase();

                var msgWpp = "";
                var hora = (new Date()).getHours();
                var saludoTiempo = "¡Feliz día! ☀️";
                var deseoCobro = "feliz día";

                if (hora >= 12 && hora < 19) {
                    saludoTiempo = "¡Feliz tarde! ☀️";
                    deseoCobro = "feliz tarde";
                } else if (hora >= 19 || hora < 5) {
                    saludoTiempo = "¡Feliz noche! 🌙";
                    deseoCobro = "feliz noche";
                }

                if (vistaActual === 'comercial') {
                    msgWpp = "Hola, *" + primerNombre + "*. 😊 ¡Espero que te encuentres muy bien! " + saludoTiempo + "\n\nTe escribo para compartirte de primera mano los beneficios y auxilios especiales de tu membresía Previser para este periodo.\n\n¿Tienes un momento para que te oriente con las opciones disponibles para ti y tu familia? 🤝";
                } else if (vistaActual === 'difusion' && mensajeDifusionCustom) {
                    msgWpp = mensajeDifusionCustom.replace(/{nombre}/g, "*" + primerNombre + "*");
                } else if (vistaActual === 'cobros') {
                    msgWpp = "hola " + primerNombre + " 👋 espero estes muy bien " + deseoCobro + "\nquedamos en que te recordara del pago hoy " + diaActualNum + ".\n\nsi necesitas que te envie alguna cuenta o que te oriente con esto me avisas. 🙌";
                } else {
                    msgWpp = "Hola, *" + primerNombre + "*. 😊 ¡Espero que te encuentres muy bien! " + saludoTiempo + "\n\nEstaba revisando las afiliaciones que se renuevan este mes y vi que la tuya ya está próxima, por eso quise escribirte con tiempo.\n\nMe gustaría ayudarte para que continúes disfrutando de todos los beneficios, descuentos y auxilios de tu membresía Previser. 💙\n\nAntes de continuar, cuéntame una cosita. 😊\n\n¿Tu grupo familiar continúa igual o hubo algún cambio que quieras incluir este año?\n\nSi te parece, lo hacemos por aquí mismo o, si prefieres, agendamos una llamada. ¿Qué te queda más cómodo? 🤝";
                }

                var urlWpp = "https://api.whatsapp.com/send?phone=" + numLimpio + "&text=" + encodeURIComponent(msgWpp);

                var valorSelect = "lista";
                if (esRenovado) valorSelect = "renovado";
                else if (esNoRenueva) valorSelect = "no_renueva";

                var card = document.createElement('div');
                card.className = "card " + tarjetaEstiloClase;
                card.id = "card-doc-" + item.idDoc;
                
                var htmlCard = '<div class="card-header">';
                htmlCard += '<span class="card-title">👤 ' + nombre + '</span>';
                htmlCard += '<span class="badge ' + badgeClass + '">' + badgeText + '</span>';
                htmlCard += '</div>';
                htmlCard += '<div class="card-body">';
                htmlCard += '<div>🪪 Cédula: <strong>' + cedula + '</strong> | 📞 <strong>' + (celular || '---') + '</strong></div>';
                htmlCard += '<div>🏢 ' + empresa + ' | 📍 ' + ciudad + '</div>';
                if (fechaVenta) { htmlCard += '<div>🗓️ Venta: <strong style="color:#fbbf24;">' + String(fechaVenta).toUpperCase() + '</strong></div>'; }
                
                htmlCard += '<div style="display:flex; align-items:center; gap:6px; margin-top:4px;">';
                htmlCard += '<span style="font-size:11px; font-weight:bold; color:#94a3b8;">Estado:</span>';
                htmlCard += '<select class="select-accion" onchange="cambiarEstadoCliente(\'' + item.idDoc + '\', \'' + item.coleccionOrigen + '\', this.value)">';
                htmlCard += '<option value="lista" ' + (valorSelect === 'lista' ? 'selected' : '') + '>📋 En Lista / Gestión</option>';
                htmlCard += '<option value="no_renueva" ' + (valorSelect === 'no_renueva' ? 'selected' : '') + '>❌ No Renueva</option>';
                htmlCard += '<option value="renovado" ' + (valorSelect === 'renovado' ? 'selected' : '') + '>✅ Renovado / Venta</option>';
                htmlCard += '</select>';
                htmlCard += '<button class="btn-edit-note" onclick="editarNotaEspecial(\'' + item.idDoc + '\', \'' + item.coleccionOrigen + '\')">✏️ Editar Nota</button>';
                htmlCard += '</div>';

                htmlCard += '<div id="nota-text-' + item.idDoc + '" style="color:#f472b6; font-style:italic; margin-top:2px;">';
                htmlCard += notaCobro ? '📝 ' + notaCobro : '📝 Sin observaciones.';
                htmlCard += '</div></div>';
                
                htmlCard += '<div class="card-actions">';
                htmlCard += '<a href="' + urlWpp + '" target="_blank" class="btn btn-wpp">💬 WhatsApp</a>';
                htmlCard += '<a href="tel:' + celular + '" class="btn btn-call">📞 Llamar</a>';
                htmlCard += '<button class="btn btn-cal" onclick="agendarEnCalendar(' + index + ')">📅 Agendar</button>';
                htmlCard += '</div>';

                card.innerHTML = htmlCard;
                contenedor.appendChild(card);
            });
        }

        async function cambiarEstadoCliente(idDoc, coleccion, nuevoValor) {
            try {
                var textoEstadoBD = "En lista";
                if (nuevoValor === "no_renueva") textoEstadoBD = "No renueva";
                else if (nuevoValor === "renovado") textoEstadoBD = "Afiliado / Renovado";

                await db.collection(coleccion).doc(idDoc).update({ estado: textoEstadoBD });

                var tarjeta = document.getElementById('card-doc-' + idDoc);
                if (tarjeta) {
                    tarjeta.classList.remove('estado-no-renueva', 'estado-renovado');
                    if (nuevoValor === "no_renueva") tarjeta.classList.add('estado-no-renueva');
                    else if (nuevoValor === "renovado") tarjeta.classList.add('estado-renovado');
                }
                alert('✅ Estado guardado: "' + textoEstadoBD + '"');
            } catch (err) {
                alert("❌ Error: " + err.message);
            }
        }

        async function editarNotaEspecial(idDoc, coleccion) {
            var item = registrosGlobales.find(function(r) { return r.idDoc === idDoc; });
            var notaActual = item ? (item.nota_cobro || item.nota_seguimiento || item.observaciones || "") : "";
            var nuevaNota = prompt("📝 Escribe la nota:", notaActual);
            
            if (nuevaNota === null) return;

            try {
                var campoNota = (coleccion === 'afiliados') ? 'nota_cobro' : 'nota_seguimiento';
                var updateObj = {};
                updateObj[campoNota] = nuevaNota.trim();

                await db.collection(coleccion).doc(idDoc).update(updateObj);

                var elNota = document.getElementById('nota-text-' + idDoc);
                if (elNota) elNota.innerHTML = nuevaNota.trim() ? "📝 " + nuevaNota.trim() : "📝 Sin observaciones.";
                alert("✅ Nota actualizada.");
            } catch (err) {
                alert("❌ Error: " + err.message);
            }
        }

        function filtrarLista() {
            var valorRaw = document.getElementById('input-buscar').value.trim();
            var campo = document.getElementById('select-criterio').value;

            var textMesAbreviado = "";
            if (campo === "mes_compra" && valorRaw) {
                var diccionarioMes = {
                    'enero': 'ene', 'ene': 'ene', 'febrero': 'feb', 'feb': 'feb', 'marzo': 'mar', 'mar': 'mar',
                    'abril': 'abr', 'abr': 'abr', 'mayo': 'may', 'may': 'may', 'junio': 'jun', 'jun': 'jun',
                    'julio': 'jul', 'jul': 'jul', 'agosto': 'ago', 'ago': 'ago', 'septiembre': 'sep', 'sep': 'sep',
                    'octubre': 'oct', 'oct': 'oct', 'noviembre': 'nov', 'nov': 'nov', 'diciembre': 'dic', 'dic': 'dic'
                };
                textMesAbreviado = diccionarioMes[valorRaw.toLowerCase().trim()] || "";
            }

            var filtrados = registrosGlobales.filter(function(data) {
                if (!valorRaw) return true;

                if (campo === "mes_compra") {
                    var f = String(data.fecha_venta || data.fec_vinc || data.fecha_compra || data.mes_compra || "").toLowerCase().trim();
                    return textMesAbreviado ? f.indexOf(textMesAbreviado) !== -1 : f.indexOf(valorRaw.toLowerCase().trim()) !== -1;
                } else if (campo === "titular") {
                    var n = String(data.titular || data.nombre || data.nombreCompleto || data.cliente || "").toLowerCase().trim();
                    return n.indexOf(valorRaw.toLowerCase().trim()) !== -1;
                } else if (campo === "cedula") {
                    var c = String(data.cedula || data.cedula_cliente || data.cedula_prospecto || data.idDoc || "").toLowerCase().trim();
                    return c.indexOf(valorRaw.toLowerCase().trim()) !== -1;
                } else if (campo === "empresa") {
                    var e = String(data.empresa || data.convenio || data.empresa_interes || "").toLowerCase().trim();
                    return e.indexOf(valorRaw.toLowerCase().trim()) !== -1;
                } else if (campo === "ciudad") {
                    var ci = String(data.ciudad || data.ciudad_prospecto || "").toLowerCase().trim();
                    return ci.indexOf(valorRaw.toLowerCase().trim()) !== -1;
                } else {
                    return JSON.stringify(data).toLowerCase().indexOf(valorRaw.toLowerCase().trim()) !== -1;
                }
            });

            filtrados.sort(function(a, b) {
                var diaA = extraerDiaNum(a);
                var diaB = extraerDiaNum(b);
                return ordenVencimientoAsc ? (diaA - diaB) : (diaB - diaA);
            });

            renderizarTarjetas(filtrados);
        }

        function activarHeyAndru() {
            var SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) return alert("Tu celular no soporta voz en navegador.");

            var recognition = new SpeechRecognition();
            recognition.lang = 'es-CO';
            var btnVoz = document.getElementById('btn-hey-andru');
            btnVoz.style.background = '#ef4444';
            recognition.start();

            recognition.onresult = function(event) {
                btnVoz.style.background = '#0284c7';
                var comando = event.results[0][0].transcript.toLowerCase().trim();

                var LISTA_MESES = ["enero", "febrero", "marzo", "abril", "mayo", "junio", "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"];
                var mes = LISTA_MESES.find(function(m) { return comando.indexOf(m) !== -1; });

                if (mes || comando.indexOf('renovacion') !== -1 || comando.indexOf('renovaciones') !== -1) {
                    document.getElementById('select-criterio').value = 'mes_compra';
                    document.getElementById('input-buscar').value = mes || "";
                    cambiarVista('renovaciones');
                } else if (comando.indexOf('bono') !== -1 || comando.indexOf('comercial') !== -1) {
                    cambiarVista('comercial');
                } else {
                    document.getElementById('select-criterio').value = 'todo';
                    document.getElementById('input-buscar').value = comando;
                    cambiarVista('afiliados');
                }
            };

            recognition.onerror = function() { btnVoz.style.background = '#0284c7'; };
            recognition.onend = function() { btnVoz.style.background = '#0284c7'; };
        }

        function abrirModalNuevo() { document.getElementById('modal-prospecto').style.display = 'flex'; }
        function cerrarModalNuevo() { document.getElementById('modal-prospecto').style.display = 'none'; }

        async function guardarProspecto() {
            var nombre = document.getElementById('nuevo-nombre').value.trim();
            var celular = document.getElementById('nuevo-celular').value.trim();
            var ciudad = document.getElementById('nuevo-ciudad').value.trim();
            var empresa = document.getElementById('nuevo-empresa').value.trim();
            var nota = document.getElementById('nuevo-nota').value.trim();

            if (!nombre || !celular) return alert("Ingresa Nombre y Celular.");

            try {
                await db.collection("prospectos").add({
                    nombre: nombre,
                    celular: celular,
                    ciudad_prospecto: ciudad || "Palmira",
                    empresa_interes: empresa || "Independiente",
                    nota_seguimiento: nota || "Ingresado desde App Móvil",
                    fecha_registro: new Date().toISOString(),
                    origen: "App Movil"
                });
                alert("✅ Guardado en Firebase.");
                cerrarModalNuevo();
                if (vistaActual === 'prospectos') cargarDatosMovil();
            } catch (err) {
                alert("❌ Error: " + err.message);
            }
        }

        cargarDatosMovil();
    </script>
